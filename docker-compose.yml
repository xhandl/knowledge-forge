services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgeforge}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    restart: unless-stopped

    healthcheck:
        test:
            [
                "CMD-SHELL",
                "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-knowledgeforge}"
            ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s

volumes:
  postgres-data: